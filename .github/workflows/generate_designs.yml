name: Generate Redbubble Designs

on:
  schedule:
    - cron: '0 6 * * *' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run python generate_designs.py
        run: python generate_designs.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          FAL_KEY: ${{ secrets.FAL_KEY }}

      # DODAJ OVO ISPOD (pazi na uvlačenje)
      - name: Save used animals to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add used_animals.txt
          git commit -m "Ažurirana lista iskorištenih životinja" || echo "Nema novih životinja za čuvanje"
          git push

    - name: Upload zip artifact (Backup)
      uses: actions/upload-artifact@v4
      with:
        name: Redbubble-Batch
        path: |
          output_images/
          redbubble_metadata.csv
