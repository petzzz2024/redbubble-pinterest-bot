name: Generate Redbubble Designs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run python generate_designs.py
      run: python generate_designs.py
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        FAL_KEY: ${{ secrets.FAL_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Za jeftin test bez slika (samo naslovi, tagovi, opisi u logu) skini # ispod:
        # METADATA_ONLY: 1

    - name: Save used birds to repository
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if [ -f used_birds.txt ]; then git add used_birds.txt; fi
        if [ -f design_history_birds.json ]; then git add design_history_birds.json; fi
        git commit -m "Ažurirana lista iskorišćenih ptica" || echo "Nema novih ptica za čuvanje"
        git pull --rebase
        git push

    - name: Upload zip artifact (Backup)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Redbubble-Batch
        path: output_images/
