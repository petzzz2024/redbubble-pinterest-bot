name: Pinterest Auto-Pin Automation

on:
  schedule:
    # Pokreće se automatski dva puta dnevno (u 11:00 i 19:00 UTC)
    - cron: '0 11,19 * * *'
  workflow_dispatch: # Omogućava ručno pokretanje na dugme u GitHub-u

jobs:
  run-pinterest-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dozvola za čuvanje osveženog posted_history.json fajla

    steps:
      - name: Preuzmi kod skladišta
        uses: actions/checkout@v4

      - name: Podesi Python okruženje
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj biblioteke iz requirements.txt
        run: |
          pip install -r requirements.txt

      - name: Pokreni Pinterest Bota
        env:
          REDBUBBLE_USERNAME: ${{ secrets.REDBUBBLE_USERNAME }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pinterest_bot.py

      - name: Sačuvaj osveženu istoriju u repozitorijum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted products history" && git push)
