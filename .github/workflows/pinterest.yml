name: Auto Post to Pinterest 3x Daily

on:
  schedule:
    # Pokreće se 3 puta dnevno u 08:00, 14:00 i 20:00 (SRB / UTC 6, 12, 18)
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pinterest-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod skladišta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Podesi Python okruženje
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj biblioteke
        run: |
          pip install --upgrade requests feedparser beautifulsoup4 google-genai

      - name: Pokreni Pinterest Bota
        env:
          REDBUBBLE_USERNAME: ${{ secrets.REDBUBBLE_USERNAME }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pinterest_bot.py

      - name: Sačuvaj istoriju objava
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Pinterest posted history [skip ci]" && git pull --rebase origin main && git push origin main)
