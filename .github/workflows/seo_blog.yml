name: Generate Daily SEO Blog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade requests google-genai

      - name: Run Blog Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_blog.py

      - name: Commit and Push Updated Blog, Sitemap and RSS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ blog.html sitemap.xml rss.xml
          git commit -m "Auto-generated daily SEO blog, updated sitemap & RSS [skip ci]" || echo "Nema novih izmena."
          git pull --rebase origin main || true
          git push origin main
