name: Generate Daily SEO Blog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade requests google-genai pillow numpy

      - name: Run Blog Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # MAX_POSTS_PER_DAY: 1      # koliko postova dnevno najviše (cron-job može da okida i češće)
          # USE_STORE_IMAGES: 0       # 0 = ne čitaj Redbubble shop, slike uvek pravi Fal.ai
        run: python generate_blog.py

      - name: Commit and Push Updated Blog, Sitemap and RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ blog.html index.html sitemap.xml rss.xml
          git rm --cached sitemap-main.xml sitemap-blog.xml || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate daily SEO blog & merge sitemap [skip ci]" && git pull --rebase origin main && git push origin main)
