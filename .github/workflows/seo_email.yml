name: Daily SEO Email Report

on:
  schedule:
    - cron: '0 9 * * *' # Pokreće se svaki dan u 09:00h po UTC vremenu
  workflow_dispatch: # Omogućava i ručno pokretanje na dugme

jobs:
  send-seo-report:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod repozitorijuma
        uses: actions/checkout@v4

      - name: Podesi Python okruženje
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj biblioteke
        run: |
          pip install -r requirements.txt

      - name: Pokreni SEO Email Bota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python seo_email_bot.py
